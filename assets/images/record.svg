<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Document -->
    <rect x="6" y="4" width="28" height="32" rx="3" stroke="darkblue" stroke-width="2" fill="#F9F9F9"/>

    <!-- Inner Document (lines) -->
    <line x1="8" y1="8" x2="30" y2="8" stroke="darkblue" stroke-width="1"/>
    <line x1="8" y1="12" x2="30" y2="12" stroke="darkblue" stroke-width="1"/>
    <line x1="8" y1="16" x2="30" y2="16" stroke="darkblue" stroke-width="1"/>
    <line x1="8" y1="20" x2="30" y2="20" stroke="darkblue" stroke-width="1"/>
    <line x1="8" y1="24" x2="30" y2="24" stroke="darkblue" stroke-width="1"/>

    <!-- Document Corner Fold -->
    <path d="M6 4 L8 6 L6 8" stroke="darkblue" stroke-width="2"/>
</svg>



